name: Run Build Batch File

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build:
    # Must use Windows to natively execute .bat files
    runs-on: windows-latest 

    steps:
      # Step 1: Check out your repository code so the runner can see build.bat
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Run the batch file using the cmd shell
      - name: Run Build Script
        shell: cmd
        run: build.bat
